<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ヒヒ掘り記録</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  font-family: sans-serif;
  margin: 10px;
}

button {
  font-size: 14px;
  padding: 6px 10px;
  margin: 2px;
}

canvas {
  max-width: 100%;
  height: 300px;
}
</style>
</head>

<body>

<h2>ヒヒ掘り記録</h2>

<button onclick="addBattle(false)">通常討伐</button>
<button onclick="addBattle(true)">青箱</button>
<button onclick="addHihi()">ヒヒ出現</button>

<p id="stats"></p>

<h3>前回ヒヒから</h3>
<p id="sinceHihi"></p>

<h3>日別（直近7日）</h3>
<p id="daily"></p>

<h3>月別</h3>
<p id="monthly"></p>

<canvas id="chart"></canvas>

<script>
let logs = JSON.parse(localStorage.getItem("logs") || "[]");

function save() {
  localStorage.setItem("logs", JSON.stringify(logs));
}

function today() {
  return new Date().toISOString().slice(0,10);
}

function addBattle(isBlue) {
  logs.push({
    date: today(),
    blue: isBlue,
    hihi: false
  });
  save();
  render();
}

function addHihi() {
  logs.push({
    date: today(),
    blue: false,
    hihi: true
  });
  save();
  render();
}

function render() {
  let total = logs.length;
  let blue = logs.filter(l => l.blue).length;
  let hihi = logs.filter(l => l.hihi).length;

  document.getElementById("stats").innerText =
    `討伐:${total} 青箱:${blue} ヒヒ:${hihi}`;

  renderSinceHihi();
  renderDaily();
  renderMonthly();
  drawChart();
}

function renderSinceHihi() {
  let last = logs.map((l,i)=>l.hihi?i:-1).filter(i=>i>=0).pop();

  let target = last == null ? logs : logs.slice(last+1);

  let battles = target.length;
  let blue = target.filter(l=>l.blue).length;

  let totalBlue = logs.filter(l=>l.blue).length;

  let percent = battles ? (blue/battles*100).toFixed(1) : 0;
  let totalPercent = logs.length ? (totalBlue/logs.length*100).toFixed(1) : 0;

  document.getElementById("sinceHihi").innerText =
    `戦闘数:${battles} / 青箱:${blue}
青箱率:${percent}%
全体青箱率:${totalPercent}%`;
}

function renderDaily() {
  let map = {};

  logs.forEach(l=>{
    if(!map[l.date]) map[l.date]={b:0,blue:0,h:0};
    map[l.date].b++;
    if(l.blue) map[l.date].blue++;
    if(l.hihi) map[l.date].h++;
  });

  let keys = Object.keys(map).sort().slice(-7);

  let text = keys.map(d=>{
    let v=map[d];
    return `${d} 討伐:${v.b} 青:${v.blue} ヒヒ:${v.h}`;
  }).join("\n");

  document.getElementById("daily").innerText = text;
}

function renderMonthly() {
  let map = {};

  logs.forEach(l=>{
    let m = l.date.slice(0,7);
    if(!map[m]) map[m]={b:0,blue:0,h:0};
    map[m].b++;
    if(l.blue) map[m].blue++;
    if(l.hihi) map[m].h++;
  });

  let text = Object.keys(map).sort().map(m=>{
    let v=map[m];
    return `${m} 討伐:${v.b} 青:${v.blue} ヒヒ:${v.h}`;
  }).join("\n");

  document.getElementById("monthly").innerText = text;
}

let chart;

function drawChart() {
  let map = {};

  logs.forEach(l=>{
    if(!map[l.date]) map[l.date]={b:0,blue:0,h:0};
    map[l.date].b++;
    if(l.blue) map[l.date].blue++;
    if(l.hihi) map[l.date].h++;
  });

  let labels = Object.keys(map).sort();

  let battles = labels.map(d=>map[d].b);
  let blue = labels.map(d=>map[d].blue);
  let hihi = labels.map(d=>map[d].h);

  if(chart) chart.destroy();

  chart = new Chart(document.getElementById("chart"), {
    type: "line",
    data: {
      labels,
      datasets: [
        {
          label: "討伐数",
          data: battles,
          borderWidth: 2,
          yAxisID: "y"
        },
        {
          label: "青箱",
          data: blue,
          borderWidth: 2,
          yAxisID: "y1"
        },
        {
          label: "ヒヒ",
          data: hihi,
          borderWidth: 2,
          yAxisID: "y1"
        }
      ]
    },
    options: {
      responsive: true,
      scales: {
        y: {
          position: "left",
          beginAtZero: true
        },
        y1: {
          position: "right",
          beginAtZero: true,
          grid: { drawOnChartArea: false }
        }
      }
    }
  });
}

render();
</script>

</body>
</html>
