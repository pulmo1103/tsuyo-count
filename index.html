<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>つよばは管理ツール</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
* { box-sizing: border-box; }

body {
    font-family: "Yu Gothic", "游ゴシック", sans-serif;
    margin: 0;
    padding: 16px;
    max-width: 500px;
    margin: auto;
    background: #f4f6fb;
    color: #222;
}

.dark {
    background: #0f172a;
    color: #e5e7eb;
}

.card {
    background: white;
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 12px;
}

.dark .card {
    background: #1e293b;
}

button {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    border: none;
    border-radius: 8px;
    background: #3b82f6;
    color: white;
    font-size: 16px;
}

input {
    width: 100%;
    padding: 8px;
    margin-top: 4px;
}

.topbar {
    display: flex;
    gap: 6px;
}
</style>
</head>

<body>

<h2>つよばは管理ツール</h2>

<div class="topbar">
<input type="date" id="date">
<button onclick="toggleDark()">🌙</button>
</div>

<div class="card">
<h3>カウンター</h3>
<button onclick="add('battles')">戦闘 +1</button>
<button onclick="add('blue')">青箱 +1</button>
<button onclick="add('hihi')">ヒヒ +1</button>
</div>

<div class="card">
<h3>統計</h3>
<div id="stats"></div>
</div>

<div class="card">
<h3>青箱率グラフ</h3>
<input type="month" id="month">
<canvas id="chart"></canvas>
</div>

<div class="card">
<button onclick="exportCSV()">CSV出力</button>
</div>

<script>
let data = JSON.parse(localStorage.getItem("data") || "{}");

const dateInput = document.getElementById("date");
const monthInput = document.getElementById("month");

dateInput.valueAsDate = new Date();
monthInput.value = dateInput.value.slice(0,7);

function getDateKey() {
    return dateInput.value;
}

function ensureDate() {
    const key = getDateKey();
    if (!data[key]) data[key] = { battles:0, blue:0, hihi:0 };
}

function add(type) {
    ensureDate();
    data[getDateKey()][type]++;
    save();
}

function save() {
    localStorage.setItem("data", JSON.stringify(data));
    update();
}

function calcStats() {
    let totalBattles = 0;
    let totalBlue = 0;
    let totalHihi = 0;

    Object.values(data).forEach(d=>{
        totalBattles += d.battles;
        totalBlue += d.blue;
        totalHihi += d.hihi;
    });

    const blueRate = totalBattles ? totalBlue/totalBattles : 0;
    const expected = totalBattles * blueRate * 0.02;
    const diff = totalHihi - expected;
    const ratio = expected ? totalHihi/expected : 0;

    return {totalBattles,totalBlue,totalHihi,blueRate,expected,diff,ratio};
}

function judge(diff) {
    if (diff >= 2) return "神";
    if (diff >= 0.5) return "上振れ";
    if (diff > -0.5) return "普通";
    if (diff > -2) return "下振れ";
    return "地獄";
}

function update() {
    const s = calcStats();

    document.getElementById("stats").innerHTML = `
    戦闘:${s.totalBattles}<br>
    青箱:${s.totalBlue}<br>
    ヒヒ:${s.totalHihi}<br>
    青箱率:${(s.blueRate*100).toFixed(1)}%<br><br>

    🔥 ${judge(s.diff)}<br>
    期待値:${s.expected.toFixed(2)}<br>
    差:${s.diff.toFixed(2)}<br>
    倍率:${s.ratio.toFixed(2)}
    `;

    drawChart();
}

function drawChart() {
    const month = monthInput.value;

    const labels = [];
    const values = [];

    Object.keys(data).sort().forEach(date=>{
        if (!date.startsWith(month)) return;

        const d = data[date];
        const rate = d.battles ? d.blue/d.battles : 0;

        labels.push(date.slice(5));
        values.push((rate*100).toFixed(1));
    });

    const ctx = document.getElementById("chart");

    if (window.chart) window.chart.destroy();

    window.chart = new Chart(ctx, {
        type:'line',
        data:{
            labels:labels,
            datasets:[{
                label:'青箱率%',
                data:values,
                tension:0.3
            }]
        }
    });
}

function exportCSV() {
    let csv = "date,battles,blue,hihi\n";

    Object.keys(data).forEach(date=>{
        const d = data[date];
        csv += `${date},${d.battles},${d.blue},${d.hihi}\n`;
    });

    const blob = new Blob([csv], {type:"text/csv"});
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "data.csv";
    link.click();
}

function toggleDark() {
    document.body.classList.toggle("dark");
}

monthInput.addEventListener("change", drawChart);

update();
</script>

</body>
</html>
