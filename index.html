<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ヒヒイロカネ集計ツール</title>

<style>
body {
  font-family: "Yu Gothic", "游ゴシック", sans-serif;
  margin: 10px;
  background: var(--bg);
  color: var(--text);
}

:root {
  --bg: #ffffff;
  --text: #000000;
  --card: #f5f5f5;
}

.dark {
  --bg: #121212;
  --text: #ffffff;
  --card: #1e1e1e;
}

.container {
  max-width: 500px;
  margin: auto;
}

.card {
  background: var(--card);
  padding: 12px;
  margin-bottom: 10px;
  border-radius: 10px;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 5px;
  font-size: 16px;
  border: none;
  border-radius: 8px;
  background: #4CAF50;
  color: white;
}

canvas {
  width: 100%;
}
</style>
</head>

<body>
<div class="container">

<h2>ヒヒイロカネ集計</h2>
<button onclick="toggleDark()">🌙 ダークモード</button>

<div class="card">
<h3>今日</h3>
<p>討伐: <span id="battle">0</span></p>
<p>青箱: <span id="blue">0</span></p>
<p>ヒヒ: <span id="hihi">0</span></p>

<button onclick="count('battle')">討伐 +1</button>
<button onclick="count('blue')">青箱 +1</button>
<button onclick="count('hihi')">ヒヒ +1</button>
</div>

<div class="card">
<h3>確率</h3>
<p>青箱率: <span id="blueRate">0</span>%</p>
<p>ヒヒ率(青箱): <span id="hihiBlueRate">0</span>%</p>
</div>

<div class="card">
<h3>累計</h3>
<p>討伐: <span id="totalBattle">0</span></p>
<p>ヒヒ: <span id="totalHihi">0</span></p>
<p>ヒヒ率: <span id="totalRate">0</span>%</p>
</div>

<div class="card">
<h3>月間グラフ</h3>
<canvas id="chart"></canvas>
</div>

</div>

<script>
const today = new Date().toISOString().slice(0,10);

let data = JSON.parse(localStorage.getItem("hihiData")) || {
  daily: {},
  totalBattle: 0,
  totalHihi: 0,
  dark: false
};

if (!data.daily[today]) {
  data.daily[today] = { battle:0, blue:0, hihi:0 };
}

function save() {
  localStorage.setItem("hihiData", JSON.stringify(data));
}

function count(type) {
  data.daily[today][type]++;
  if (type === "battle") data.totalBattle++;
  if (type === "hihi") data.totalHihi++;
  save();
  update();
}

function update() {
  let d = data.daily[today];

  document.getElementById("battle").textContent = d.battle;
  document.getElementById("blue").textContent = d.blue;
  document.getElementById("hihi").textContent = d.hihi;

  let blueRate = d.battle ? (d.blue/d.battle*100).toFixed(2) : 0;
  let hihiBlueRate = d.blue ? (d.hihi/d.blue*100).toFixed(2) : 0;

  document.getElementById("blueRate").textContent = blueRate;
  document.getElementById("hihiBlueRate").textContent = hihiBlueRate;

  let totalRate = data.totalBattle ? (data.totalHihi/data.totalBattle*100).toFixed(3) : 0;

  document.getElementById("totalBattle").textContent = data.totalBattle;
  document.getElementById("totalHihi").textContent = data.totalHihi;
  document.getElementById("totalRate").textContent = totalRate;

  drawChart();

  if (data.dark) document.body.classList.add("dark");
}

function drawChart() {
  const ctx = document.getElementById("chart").getContext("2d");

  const labels = [];
  const values = [];

  const now = new Date();
  const month = now.toISOString().slice(0,7);

  Object.keys(data.daily).forEach(date => {
    if (date.startsWith(month)) {
      labels.push(date.slice(8));
      values.push(data.daily[date].hihi);
    }
  });

  ctx.clearRect(0,0,400,200);

  const max = Math.max(...values,1);

  values.forEach((v,i)=>{
    let x = i * 20;
    let h = (v/max)*100;
    ctx.fillRect(x, 120-h, 15, h);
    ctx.fillText(labels[i], x, 135);
  });
}

function toggleDark() {
  data.dark = !data.dark;
  save();
  update();
}

update();
</script>

</body>
</html>
