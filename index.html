<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>つよばはヒヒ管理ツール</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  font-family: "Yu Gothic", sans-serif;
  margin:0; padding:10px;
  background:#0b1a2b; color:#fff;
}
body.light { background:#f5f5f5; color:#000; }

button {
  padding:14px 0;
  margin:5px;
  border-radius:12px;
  border:none;
  font-size:14px;
  background:#1e3a5f;
  color:white;
}
body.light button { background:#ddd; color:black; }

.card {
  background:#13263d;
  padding:10px;
  border-radius:12px;
  margin-bottom:10px;
}
body.light .card { background:#fff; }

.counter {
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.counter input {
  width:70px;
  font-size:18px;
  padding:8px;
  border-radius:8px;
  text-align:center;
}

.counter button { flex:1; }

canvas{
  width:100% !important;
  max-height:50vh;
}

/* ヒヒ演出 */
.hihiFlash{
  position:fixed;
  top:50%; left:50%;
  transform:translate(-50%,-50%) scale(0);
  font-size:80px;
  color:gold;
  animation:hihiPop 0.6s ease-out forwards;
}
@keyframes hihiPop{
  0%{transform:translate(-50%,-50%) scale(0);opacity:0;}
  50%{transform:translate(-50%,-50%) scale(1.6);opacity:1;}
  100%{transform:translate(-50%,-50%) scale(1);opacity:0;}
}
</style>
</head>

<body>

<h2>つよばはヒヒ管理</h2>
<button onclick="toggleTheme()">ダーク/ライト切替</button>

<div class="card">
  <h3>入力日</h3>
  <input type="date" id="inputDate">
</div>

<div class="card">
<h3>今日のカウンター</h3>

<div class="counter">
<label>討伐</label>
<input type="number" id="kill" value="0" onchange="updateCount('kill',this.value)">
<button onclick="add('kill')">+1</button>
</div>

<div class="counter">
<label>青箱</label>
<input type="number" id="blue" value="0" onchange="updateCount('blue',this.value)">
<button onclick="add('blue')">+1</button>
</div>

<div class="counter">
<label>ヒヒ</label>
<input type="number" id="hihi" value="0" onchange="updateCount('hihi',this.value)">
<button onclick="add('hihi')">+1</button>
</div>
</div>

<div class="card">
<h3>前回ヒヒから</h3>
<div id="sinceHihi"></div>
</div>

<div class="card">
<h3>直近7日</h3>
<div id="dailyStats"></div>
</div>

<div class="card">
<h3>月別統計</h3>
<div id="monthlyStats"></div>
</div>

<div class="card">
<h3>グラフ</h3>
<input type="month" id="month" onchange="renderChart()">
<canvas id="chart"></canvas>
</div>

<script>
let data = JSON.parse(localStorage.getItem("data")||"{}");

function getDate(){
  return document.getElementById("inputDate").value
    || new Date().toISOString().slice(0,10);
}

function save(){
  localStorage.setItem("data",JSON.stringify(data));
}

function add(type){
  let d=getDate();
  if(!data[d]) data[d]={kill:0,blue:0,hihi:0};
  data[d][type]++;
  if(type==="hihi") triggerHihi();
  save(); update(); renderChart();
}

function updateCount(type,val){
  let d=getDate();
  if(!data[d]) data[d]={kill:0,blue:0,hihi:0};
  data[d][type]=Math.max(0,Number(val)||0);
  save(); update(); renderChart();
}

function getSinceLastHihi(){
  let dates=Object.keys(data).sort();
  let total=0,last=0;
  dates.forEach(d=>{
    total+=data[d].kill||0;
    if((data[d].hihi||0)>0) last=total;
  });
  return total-last;
}

function renderStats(){
  document.getElementById("sinceHihi").textContent =
    getSinceLastHihi()+"戦";

  let daily=document.getElementById("dailyStats");
  daily.innerHTML="";
  Object.keys(data).sort().reverse().slice(0,7).forEach(d=>{
    let v=data[d];
    daily.innerHTML+=`${d}｜討伐:${v.kill} 青箱:${v.blue} ヒヒ:${v.hihi}<br>`;
  });

  let m={}, monthly=document.getElementById("monthlyStats");
  monthly.innerHTML="";
  Object.keys(data).forEach(d=>{
    let key=d.slice(0,7);
    if(!m[key]) m[key]={kill:0,blue:0,hihi:0};
    m[key].kill+=data[d].kill||0;
    m[key].blue+=data[d].blue||0;
    m[key].hihi+=data[d].hihi||0;
  });
  Object.keys(m).sort().reverse().forEach(k=>{
    let v=m[k];
    monthly.innerHTML+=`${k}｜討伐:${v.kill} 青箱:${v.blue} ヒヒ:${v.hihi}<br>`;
  });
}

function update(){
  let d=getDate();
  if(!data[d]) data[d]={kill:0,blue:0,hihi:0};
  document.getElementById("kill").value=data[d].kill;
  document.getElementById("blue").value=data[d].blue;
  document.getElementById("hihi").value=data[d].hihi;
  renderStats();
}

let chart;
function renderChart(){
  const ctx=document.getElementById("chart");
  const month=document.getElementById("month").value
    || new Date().toISOString().slice(0,7);

  let labels=[],kills=[],blues=[],hihis=[],bg=[];

  Object.keys(data).sort().forEach(d=>{
    if(d.startsWith(month)){
      let v=data[d];
      labels.push(d);
      kills.push(v.kill||0);
      blues.push(v.blue||0);
      hihis.push(v.hihi||0);
      bg.push(v.hihi>0 ? "rgba(255,215,0,0.15)" : "transparent");
    }
  });

  if(chart) chart.destroy();

  chart=new Chart(ctx,{
    data:{
      labels,
      datasets:[
        {
          type:"bar",
          label:"討伐",
          data:kills,
          backgroundColor:"rgba(255,99,132,0.75)",
          borderRadius:4,
          barThickness:6
        },
        {
          type:"line",
          label:"青箱",
          data:blues,
          borderColor:"rgba(59,130,246,1)",
          backgroundColor:"rgba(59,130,246,0.2)",
          tension:0.3,
          borderWidth:2,
          pointRadius:2
        },
        {
          type:"line",
          label:"ヒヒ",
          data:hihis,
          borderColor:"rgba(255,215,0,1)",
          borderWidth:3,
          tension:0,
          pointRadius:(ctx)=>ctx.raw>0?8:0,
          pointStyle:(ctx)=>ctx.raw>0?"star":"circle"
        }
      ]
    },
    options:{
      responsive:true,
      plugins:{ tooltip:{enabled:false} },
      scales:{
        x:{
          ticks:{ color:"#ccc" },
          grid:{ color:"rgba(255,255,255,0.05)" }
        },
        y:{
          beginAtZero:true,
          grace:"10%",
          ticks:{ color:"#ccc" },
          grid:{ color:"rgba(255,255,255,0.08)" }
        }
      }
    },
    plugins:[{
      id:"bgColor",
      beforeDraw(c){
        const {ctx,chartArea,scales:{x}}=c;
        labels.forEach((_,i)=>{
          if(bg[i]!=="transparent"){
            const x1=x.getPixelForValue(i)-10;
            const x2=x.getPixelForValue(i)+10;
            ctx.fillStyle=bg[i];
            ctx.fillRect(x1,chartArea.top,x2-x1,chartArea.bottom-chartArea.top);
          }
        });
      }
    }]
  });
}

function toggleTheme(){
  document.body.classList.toggle("light");
}

function triggerHihi(){
  const el=document.createElement("div");
  el.className="hihiFlash";
  el.innerText="★";
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),600);
}

document.getElementById("inputDate").value=new Date().toISOString().slice(0,10);

update();
renderChart();
</script>

</body>
</html>
