<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>つよばは管理ツール</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  font-family: "Yu Gothic", sans-serif;
  background:#f4f6fb;
  margin:0;
  padding:10px;
}

h2{margin:5px 0;}

button{
  width:32%;
  padding:14px;
  font-size:14px;
  margin:4px 0;
  border:none;
  border-radius:10px;
}

.kill{background:#ff6b6b;color:white;}
.blue{background:#4dabf7;color:white;}
.hihi{background:gold;color:black;}

.card{
  background:white;
  padding:10px;
  border-radius:10px;
  margin:10px 0;
}

#chartWrap{
  width:100%;
}

</style>
</head>

<body>

<h2>つよばはカウンター</h2>

<div>
  <button class="kill" onclick="addKill()">討伐+1</button>
  <button class="blue" onclick="addBlue()">青箱+1</button>
  <button class="hihi" onclick="addHihi()">ヒヒ+1</button>
</div>

<div class="card">
  <div id="today"></div>
  <div id="since"></div>
  <div id="hihiPos"></div>
</div>

<div class="card">
  <canvas id="chart"></canvas>
</div>

<script>

// ===== データ =====
let data = JSON.parse(localStorage.getItem("data")||"{}");
let log = JSON.parse(localStorage.getItem("log")||"[]");
let hihiHistory = JSON.parse(localStorage.getItem("hihiHistory")||"[]");

function save(){
  localStorage.setItem("data", JSON.stringify(data));
  localStorage.setItem("log", JSON.stringify(log));
  localStorage.setItem("hihiHistory", JSON.stringify(hihiHistory));
}

// ===== 日付 =====
function getDate(){
  return new Date().toISOString().slice(0,10);
}

function initDate(){
  let d=getDate();
  if(!data[d]){
    data[d]={kill:0,blue:0,hihi:0};
  }
}

// ===== ログ =====
function addLog(type){
  log.push({
    date:getDate(),
    type:type
  });
}

// ===== カウンター =====
function addKill(){
  initDate();
  data[getDate()].kill++;
  addLog("kill");
  save();
  update();
}

function addBlue(){
  initDate();
  data[getDate()].blue++;
  addLog("blue");
  save();
  update();
}

function addHihi(){
  initDate();
  data[getDate()].hihi++;

  // 🔥 ヒヒ位置記録
  let since = calcSinceLastHihi();
  hihiHistory.push(since.sinceKill + 1);

  addLog("hihi");
  save();
  update();
}

// ===== 前回ヒヒから =====
function calcSinceLastHihi(){

  let sinceKill=0;
  let sinceBlue=0;

  for(let i=log.length-1;i>=0;i--){
    let e=log[i];

    if(e.type==="hihi") break;

    if(e.type==="kill") sinceKill++;
    if(e.type==="blue") sinceBlue++;
  }

  return {
    sinceKill,
    sinceBlue,
    sinceBlueRate: sinceKill>0 ? (sinceBlue/sinceKill*100).toFixed(1) : 0
  };
}

// ===== ヒヒ履歴 =====
function getHihiStats(){

  if(hihiHistory.length===0){
    return "ヒヒ履歴なし";
  }

  let avg = (hihiHistory.reduce((a,b)=>a+b,0)/hihiHistory.length).toFixed(1);
  let last = hihiHistory[hihiHistory.length-1];

  return `直近ヒヒ：${last}戦目 / 平均：${avg}戦`;
}

// ===== 表示 =====
function update(){

  initDate();

  let today = data[getDate()];
  document.getElementById("today").textContent =
    `今日：${today.kill}戦 / 青${today.blue} / ヒヒ${today.hihi}`;

  let since = calcSinceLastHihi();
  document.getElementById("since").textContent =
    `前回ヒヒから：${since.sinceKill}戦（青${since.sinceBlue} / ${since.sinceBlueRate}%）`;

  document.getElementById("hihiPos").textContent = getHihiStats();

  drawChart();
}

// ===== グラフ =====
let chart;

function drawChart(){

  let labels = Object.keys(data).sort();
  let kill = labels.map(d=>data[d].kill);
  let blue = labels.map(d=>data[d].blue);
  let hihi = labels.map(d=>data[d].hihi);

  let ctx = document.getElementById("chart");

  if(chart) chart.destroy();

  chart = new Chart(ctx,{
    type:"bar",
    data:{
      labels:labels,
      datasets:[
        {
          label:"討伐",
          data:kill,
          backgroundColor:"rgba(255,99,132,0.6)",
          barThickness:8
        },
        {
          label:"青箱",
          data:blue,
          type:"line",
          borderColor:"blue"
        },
        {
          label:"ヒヒ",
          data:hihi,
          type:"line",
          borderColor:"gold",
          borderWidth:3
        }
      ]
    },
    options:{
      responsive:true,
      scales:{
        y:{beginAtZero:true}
      }
    }
  });
}

// ===== 初期化 =====
update();

</script>

</body>
</html>
