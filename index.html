<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>つよばはカウンター</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  font-family:"Yu Gothic",sans-serif;
  margin:10px;
  background:#f1f5f9;
}

body.dark{
  background:#0f172a;
  color:#e2e8f0;
}

.card{
  background:white;
  padding:10px;
  margin-bottom:10px;
  border-radius:10px;
}

body.dark .card{
  background:#1e293b;
}

/* ボタン */
.counter-row{
  display:flex;
  gap:10px;
  margin-bottom:10px;
}

.counter-btn{
  flex:1;
  font-size:18px;
  padding:16px;
  border:none;
  border-radius:12px;
  font-weight:bold;
  color:white;
}

.counter-btn.battle{background:#ef4444;}
.counter-btn.blue{background:#3b82f6;}
.counter-btn.hihi{
  background:linear-gradient(135deg,#facc15,#eab308);
  color:#222;
}

.counter-btn:active{
  transform:scale(0.96);
}
</style>
</head>

<body>

<h2>つよばは管理</h2>

<div class="card">

<input type="date" id="date">

<label style="display:flex;align-items:center;gap:8px;margin-top:5px;">
  <input type="checkbox" id="pastMode">
  過去日モード
</label>

<button onclick="toggleDark()">ダーク切替</button>

</div>

<div class="card">

<div class="counter-row">
  <button class="counter-btn battle" onclick="addBattle()">討伐</button>
  <button class="counter-btn blue" onclick="addBlue()">青箱</button>
  <button class="counter-btn hihi" onclick="addHihi()">ヒヒ</button>
</div>

</div>

<div class="card">
<canvas id="chart"></canvas>
</div>

<div class="card" id="stats"></div>

<script>
let logs = JSON.parse(localStorage.getItem("logs")||"[]");
let chart;

// ===== 日付 =====
function getToday(){
  return document.getElementById("date").value;
}

function isPastMode(){
  return document.getElementById("pastMode").checked;
}

function setToday(){
  if(!isPastMode()){
    const today = new Date().toISOString().split("T")[0];
    document.getElementById("date").value = today;
  }
}

// ===== 保存 =====
function save(){
  localStorage.setItem("logs",JSON.stringify(logs));
}

// ===== 追加 =====
function addBattle(){
  logs.push({date:getToday(),blue:0,hihi:0});
  save(); updateAll(); setToday();
}

function addBlue(){
  logs.push({date:getToday(),blue:1,hihi:0});
  save(); updateAll(); setToday();
}

function addHihi(){
  logs.push({date:getToday(),blue:1,hihi:1});
  save(); updateAll(); setToday();
}

// ===== 集計 =====
function updateStats(){
  let totalB=logs.length;
  let totalBlue=logs.filter(l=>l.blue).length;
  let totalHihi=logs.filter(l=>l.hihi).length;

  document.getElementById("stats").innerHTML=`
  討伐:${totalB}<br>
  青箱:${totalBlue}<br>
  ヒヒ:${totalHihi}
  `;
}

// ===== グラフ =====
function drawChart(){

  let map={};

  logs.forEach(l=>{
    if(!map[l.date]) map[l.date]={b:0,blue:0,h:0};
    map[l.date].b++;
    if(l.blue) map[l.date].blue++;
    if(l.hihi) map[l.date].h++;
  });

  let labels=Object.keys(map).sort();

  let b=labels.map(d=>map[d].b);
  let blue=labels.map(d=>map[d].blue);
  let h=labels.map(d=>map[d].h);

  if(chart) chart.destroy();

  chart=new Chart(document.getElementById("chart"),{
    data:{
      labels:labels,
      datasets:[
        {
          type:"bar",
          label:"討伐",
          data:b,
          yAxisID:"y",
          backgroundColor:"rgba(255,80,80,0.7)",
          barThickness:6
        },
        {
          type:"line",
          label:"青箱",
          data:blue,
          yAxisID:"y1",
          borderColor:"#3399ff",
          tension:0.3
        },
        {
          type:"line",
          label:"ヒヒ",
          data:h,
          yAxisID:"y1",
          borderColor:"gold",
          tension:0.3
        }
      ]
    },
    options:{
      responsive:true,
      scales:{
        y:{position:"left",beginAtZero:true},
        y1:{
          position:"right",
          beginAtZero:true,
          grid:{drawOnChartArea:false}
        }
      }
    }
  });
}

// ===== ダーク =====
function toggleDark(){
  document.body.classList.toggle("dark");
}

// ===== 更新 =====
function updateAll(){
  updateStats();
  drawChart();
}

// ===== 起動時 =====
window.addEventListener("load",function(){
  setToday();
  updateAll();
});
</script>

</body>
</html>
