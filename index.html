<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>つよばは管理ツール</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  font-family:"Yu Gothic",sans-serif;
  background:#f4f6fb;
  margin:0;
  padding:10px;
}

button{
  width:32%;
  padding:12px;
  font-size:13px;
  margin:4px 0;
  border:none;
  border-radius:10px;
}

.kill{background:#ff7b7b;color:white;}
.blue{background:#4dabf7;color:white;}
.hihi{background:gold;color:black;}

.card{
  background:white;
  padding:10px;
  border-radius:10px;
  margin:10px 0;
}
</style>
</head>

<body>

<h2>つよばは管理</h2>

<div>
  <button class="kill" onclick="addKill()">討伐+1</button>
  <button class="blue" onclick="addBlue()">青箱+1</button>
  <button class="hihi" onclick="addHihi()">ヒヒ+1</button>
</div>

<div class="card">
  <div id="today"></div>
  <div id="since"></div>
  <div id="sinceDetail"></div>
  <div id="hihiPosition"></div>
</div>

<div class="card">
  <canvas id="chart"></canvas>
</div>

<div class="card">
  <h3>日別（7日）</h3>
  <div id="daily"></div>
</div>

<div class="card">
  <h3>月別</h3>
  <div id="monthly"></div>
</div>

<script>

// ===== データ =====
let data = JSON.parse(localStorage.getItem("data")||"{}");
let log = JSON.parse(localStorage.getItem("log")||"[]");
let hihiHistory = JSON.parse(localStorage.getItem("hihiHistory")||"[]");

function save(){
  localStorage.setItem("data",JSON.stringify(data));
  localStorage.setItem("log",JSON.stringify(log));
  localStorage.setItem("hihiHistory",JSON.stringify(hihiHistory));
}

// ===== 日付 =====
function getToday(){
  return new Date().toISOString().slice(0,10);
}

function init(){
  let d=getToday();
  if(!data[d]){
    data[d]={kill:0,blue:0,hihi:0};
  }
}

// ===== ログ =====
function addLog(type){
  log.push({date:getToday(),type:type,time:Date.now()});
}

// ===== カウント =====
function addKill(){
  init();
  data[getToday()].kill++;
  addLog("kill");
  save();
  update();
}

function addBlue(){
  init();
  data[getToday()].blue++;
  addLog("blue");
  save();
  update();
}

function addHihi(){
  init();
  data[getToday()].hihi++;

  const since = calcSinceLastHihi();
  hihiHistory.push(since.sinceKill + 1);

  addLog("hihi");
  save();
  update();
}

// ===== 前回ヒヒから =====
function calcSinceLastHihi(){

  let sinceKill=0;
  let sinceBlue=0;

  for(let i=log.length-1;i>=0;i--){
    let e=log[i];

    if(e.type==="hihi") break;

    if(e.type==="kill") sinceKill++;
    if(e.type==="blue") sinceBlue++;
  }

  return {
    sinceKill,
    sinceBlue,
    sinceBlueRate: sinceKill>0 ? (sinceBlue/sinceKill*100).toFixed(1) : 0
  };
}

// ===== ヒヒ位置 =====
function renderHihiPosition(){
  if(hihiHistory.length===0){
    return "ヒヒ履歴なし";
  }

  let last = hihiHistory[hihiHistory.length-1];
  let avg = (hihiHistory.reduce((a,b)=>a+b,0)/hihiHistory.length).toFixed(1);

  return `直近ヒヒ：${last}戦 / 平均：${avg}戦`;
}

// ===== 日別 =====
function renderDaily(){
  let dates = Object.keys(data).sort().reverse().slice(0,7);
  let html="";
  dates.forEach(d=>{
    let v=data[d];
    html += `${d}：${v.kill}戦 / 青${v.blue} / ヒヒ${v.hihi}<br>`;
  });
  document.getElementById("daily").innerHTML = html;
}

// ===== 月別 =====
function renderMonthly(){

  let m={};

  Object.keys(data).forEach(d=>{
    let month=d.slice(0,7);
    if(!m[month]) m[month]={kill:0,blue:0,hihi:0};

    m[month].kill+=data[d].kill;
    m[month].blue+=data[d].blue;
    m[month].hihi+=data[d].hihi;
  });

  let html="";
  Object.keys(m).sort().forEach(k=>{
    let v=m[k];
    html += `${k}：${v.kill}戦 / 青${v.blue} / ヒヒ${v.hihi}<br>`;
  });

  document.getElementById("monthly").innerHTML = html;
}

// ===== グラフ =====
let chart;

function drawChart(){

  let labels = Object.keys(data).sort();

  let kill = labels.map(d=>data[d].kill);
  let blue = labels.map(d=>data[d].blue);
  let hihi = labels.map(d=>data[d].hihi);

  let ctx = document.getElementById("chart");

  if(chart) chart.destroy();

  chart = new Chart(ctx,{
    data:{
      labels:labels,
      datasets:[
        {
          type:"bar",
          label:"討伐",
          data:kill,
          yAxisID:"y",
          backgroundColor:"rgba(255,120,120,0.7)",
          barThickness:8
        },
        {
          type:"line",
          label:"青箱",
          data:blue,
          yAxisID:"y1",
          borderColor:"#4dabf7",
          borderWidth:2,
          tension:0.3
        },
        {
          type:"line",
          label:"ヒヒ",
          data:hihi,
          yAxisID:"y1",
          borderColor:"gold",
          borderWidth:3,
          pointRadius:5,
          tension:0.3
        }
      ]
    },
    options:{
      responsive:true,
      plugins:{legend:{display:true}},
      scales:{
        y:{
          position:"left",
          beginAtZero:true,
          title:{display:true,text:"討伐数"}
        },
        y1:{
          position:"right",
          beginAtZero:true,
          grid:{drawOnChartArea:false},
          title:{display:true,text:"青箱 / ヒヒ"}
        }
      }
    }
  });
}

// ===== 更新 =====
function update(){

  init();

  let t=data[getToday()];
  document.getElementById("today").textContent =
    `今日：${t.kill}戦 / 青${t.blue} / ヒヒ${t.hihi}`;

  let since = calcSinceLastHihi();

  document.getElementById("since").textContent =
    `前回ヒヒから：${since.sinceKill}戦`;

  document.getElementById("sinceDetail").textContent =
    `青箱：${since.sinceBlue}（${since.sinceBlueRate}%）`;

  document.getElementById("hihiPosition").textContent =
    renderHihiPosition();

  renderDaily();
  renderMonthly();
  drawChart();
}

// ===== 初期 =====
update();

</script>

</body>
</html>
