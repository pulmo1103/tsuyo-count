<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>つよばはヒヒ管理ツール</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  font-family: "Yu Gothic", "游ゴシック", sans-serif;
  margin: 0;
  padding: 10px;
  background: #0b1a2b;
  color: #fff;
}

body.light {
  background: #f5f5f5;
  color: #000;
}

button {
  padding: 12px;
  margin: 5px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  background: #1e3a5f;
  color: white;
}

body.light button {
  background: #ddd;
  color: black;
}

.card {
  background: #13263d;
  padding: 10px;
  border-radius: 12px;
  margin-bottom: 10px;
}

body.light .card {
  background: #fff;
}

.counter {
  font-size: 20px;
}

/* ★ピカ */
.star::after {
  content:"★";
  position:absolute;
  color:white;
  opacity:0;
  filter:blur(4px);
  animation:sparkle 2s infinite;
}

@keyframes sparkle {
  0%,85%,100%{opacity:0;}
  90%{opacity:1;}
}

/* ヒヒ演出 */
.hihi {
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) scale(0);
  font-size:80px;
  color:gold;
  animation:hihiAnim 1s forwards;
}

@keyframes hihiAnim {
  0%{transform:translate(-50%,-50%) scale(0);opacity:0;}
  50%{transform:translate(-50%,-50%) scale(1.5);opacity:1;}
  100%{transform:translate(-50%,-50%) scale(1);opacity:0;}
}

/* 金フラッシュ */
.flash {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background: radial-gradient(circle, rgba(255,215,0,0.6) 0%, transparent 70%);
  pointer-events:none;
  animation:flashAnim 0.4s ease;
}

@keyframes flashAnim {
  from{opacity:1;}
  to{opacity:0;}
}

canvas {
  max-height: 50vh;
}
</style>
</head>

<body>

<h2>つよばはヒヒ管理</h2>

<button onclick="toggleTheme()">ダーク/ライト切替</button>

<div class="card">
  <h3>今日のカウンター</h3>
  <div class="counter">討伐: <span id="kill">0</span></div>
  <div class="counter">青箱: <span id="blue">0</span></div>
  <div class="counter">ヒヒ: <span id="hihi">0</span></div>

  <button onclick="add('kill')">討伐+1</button>
  <button onclick="add('blue')">青箱+1</button>
  <button onclick="add('hihi')">ヒヒ+1</button>
</div>

<div class="card">
  <h3>統計</h3>
  <div id="stats"></div>
</div>

<div class="card">
  <h3>グラフ（月切替）</h3>
  <input type="month" id="month" onchange="renderChart()">
  <canvas id="chart"></canvas>
</div>

<div class="card">
  <button onclick="downloadCSV()">CSV出力</button>
</div>

<script>
const DROP_RATE = 0.02;
let data = JSON.parse(localStorage.getItem("data") || "{}");
let today = new Date().toISOString().slice(0,10);

if (!data[today]) data[today] = {kill:0, blue:0, hihi:0};

function save(){
  localStorage.setItem("data", JSON.stringify(data));
}

function add(type){
  data[today][type]++;
  if(type==="hihi") showHihi();
  save();
  update();
  renderChart();
}

function showHihi(){
  const el=document.createElement("div");
  el.className="hihi";
  el.innerText="★";
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1000);
}

function flashGold(){
  const f=document.createElement("div");
  f.className="flash";
  document.body.appendChild(f);
  setTimeout(()=>f.remove(),400);
}

function update(){
  document.getElementById("kill").innerText=data[today].kill;
  document.getElementById("blue").innerText=data[today].blue;
  document.getElementById("hihi").innerText=data[today].hihi;

  let totalKill=0,totalBlue=0,totalHihi=0,streak=0;

  Object.keys(data).sort().forEach(d=>{
    totalKill+=data[d].kill;
    totalBlue+=data[d].blue;
    totalHihi+=data[d].hihi;
    if(data[d].hihi>0){
      streak=0;
    }else{
      streak+=data[d].kill;
    }
  });

  let blueRate = totalBlue/totalKill*100 || 0;
  let hihiRate = totalHihi/totalBlue*100 || 0;

  let expected = totalBlue*DROP_RATE;
  let diff = totalHihi - expected;
  let judge = diff>0 ? "神" : "地獄";

  if(diff>0) flashGold();

  document.getElementById("stats").innerHTML=`
    青箱率: ${blueRate.toFixed(2)}%<br>
    ヒヒ率: ${hihiRate.toFixed(2)}%<br>
    前回ヒヒから: ${streak}戦<br>
    判定: ${judge} (${diff.toFixed(2)})
  `;
}

let chart;

function renderChart(){
  const ctx=document.getElementById("chart");
  const month=document.getElementById("month").value || today.slice(0,7);

  let labels=[],hihiRates=[],blueRates=[],pointStyles=[];

  Object.keys(data).sort().forEach(d=>{
    if(d.startsWith(month)){
      let v=data[d];
      labels.push(d);

      let hihiRate = v.blue ? v.hihi/v.blue*100 : 0;
      let blueRate = v.kill ? v.blue/v.kill*100 : 0;

      hihiRates.push(hihiRate);
      blueRates.push(blueRate);

      pointStyles.push(v.hihi>0 ? "star" : "circle");
    }
  });

  if(chart) chart.destroy();

  chart=new Chart(ctx,{
    type:"line",
    data:{
      labels:labels,
      datasets:[
      {
        label:"ヒヒ率%",
        data:hihiRates,
        pointStyle:pointStyles,
        pointRadius:6,
        yAxisID:'y'
      },
      {
        label:"青箱率%",
        data:blueRates,
        yAxisID:'y1'
      }]
    },
    options:{
      animation:{duration:300},
      scales:{
        y:{position:"left"},
        y1:{
          position:"right",
          grid:{drawOnChartArea:false}
        }
      }
    }
  });
}

function downloadCSV(){
  let csv="date,kill,blue,hihi\n";
  Object.keys(data).forEach(d=>{
    let v=data[d];
    csv+=`${d},${v.kill},${v.blue},${v.hihi}\n`;
  });
  const blob=new Blob([csv]);
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="data.csv";
  a.click();
}

function toggleTheme(){
  document.body.classList.toggle("light");
}

update();
renderChart();
</script>

</body>
</html>
