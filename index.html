<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>つよばはヒヒ管理ツール</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body {
  font-family: "Yu Gothic", "游ゴシック", sans-serif;
  margin:0; padding:10px;
  background:#0b1a2b; color:#fff;
}
body.light { background:#f5f5f5; color:#000; }

button { padding:12px; margin:5px; border-radius:10px; border:none; font-size:16px; background:#1e3a5f; color:white; }
body.light button { background:#ddd; color:black; }

.card { background:#13263d; padding:10px; border-radius:12px; margin-bottom:10px; }
body.light .card { background:#fff; }

.counter input { width:60px; font-size:18px; text-align:center; }
ul{padding-left:20px;}
.star::after { content:"★"; position:absolute; color:white; opacity:0; filter:blur(4px); animation:sparkle 2s infinite; }
@keyframes sparkle {0%,85%,100%{opacity:0;}90%{opacity:1;}}

.hihi{ position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(0); font-size:80px; color:gold; animation:hihiAnim 1s forwards; }
@keyframes hihiAnim { 0%{transform:translate(-50%,-50%) scale(0);opacity:0;}50%{transform:translate(-50%,-50%) scale(1.5);opacity:1;}100%{transform:translate(-50%,-50%) scale(1);opacity:0;} }

.flash{ position:fixed; top:0; left:0; width:100%; height:100%; background: radial-gradient(circle, rgba(255,215,0,0.6) 0%, transparent 70%); pointer-events:none; animation:flashAnim 0.4s ease; }
@keyframes flashAnim { from{opacity:1;} to{opacity:0;} }

canvas{ max-height:50vh; }

  .counter {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

.counter label {
  min-width: 60px;
}

.counter input {
  width: 70px;
  font-size: 20px;
  padding: 8px;
  border-radius: 8px;
  text-align: center;
}

.counter button {
  flex: 1;
  padding: 18px 0;
  font-size: 18px;
  border-radius: 12px;
}
</style>
</head>
<body>

<h2>つよばはヒヒ管理</h2>
<button onclick="toggleTheme()">ダーク/ライト切替</button>

<div class="card">
  <h3>入力日</h3>
  <input type="date" id="inputDate">
</div>

<div class="card">
  <h3>今日のカウンター</h3>
<div class="counter">
  <label>討伐</label>
  <input type="number" id="kill" value="0" onchange="updateCount('kill', this.value)">
  <button onclick="add('kill')">+1</button>
</div>

<div class="counter">
  <label>青箱</label>
  <input type="number" id="blue" value="0" onchange="updateCount('blue', this.value)">
  <button onclick="add('blue')">+1</button>
</div>

<div class="counter">
  <label>ヒヒ</label>
  <input type="number" id="hihi" value="0" onchange="updateCount('hihi', this.value)">
  <button onclick="add('hihi')">+1</button>
</div>
</div>

<div class="card">
  <h3>日別統計ログ (直近50日)</h3>
  <ul id="history"></ul>
</div>

<div class="card">
  <h3>統計</h3>
  <div id="stats"></div>
</div>

<div class="card">
  <h3>グラフ（月切替）</h3>
  <input type="month" id="month" onchange="renderChart()">
  <canvas id="chart"></canvas>
</div>

<div class="card">
  <button onclick="downloadCSV()">CSV出力</button>
</div>

<script>
const DROP_RATE = 0.02;
let data = JSON.parse(localStorage.getItem("data") || "{}");

function getSelectedDate(){
  const val = document.getElementById("inputDate").value;
  return val ? val : new Date().toISOString().slice(0,10);
}

function save(){ localStorage.setItem("data", JSON.stringify(data)); }

// ボタン +1用
function add(type){
  let date = getSelectedDate();
  if(!data[date]) data[date] = {kill:0, blue:0, hihi:0};
  data[date][type] = Number(data[date][type] || 0) + 1;
  if(type==="hihi") showHihi();
  save();
  update();
  renderChart();
}

// 直接入力用
function updateCount(type, val){
  let date = getSelectedDate();
  if(!data[date]) data[date] = {kill:0, blue:0, hihi:0};
  data[date][type] = Math.max(0, Number(val) || 0); // NaN対策 + マイナス防止
  save();
  update();
  renderChart();
}

function showHihi(){
  const el=document.createElement("div");
  el.className="hihi";
  el.innerText="★";
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1000);
}

function flashGold(){
  const f=document.createElement("div");
  f.className="flash";
  document.body.appendChild(f);
  setTimeout(()=>f.remove(),400);
}

function update(){
  let date = getSelectedDate();
  if(!data[date]) data[date] = {kill:0, blue:0, hihi:0};

  // 数値保証
  let today = data[date];
  today.kill = Number(today.kill || 0);
  today.blue = Number(today.blue || 0);
  today.hihi = Number(today.hihi || 0);

  // inputに反映
  document.getElementById("kill").value = today.kill;
  document.getElementById("blue").value = today.blue;
  document.getElementById("hihi").value = today.hihi;

  let totalKill=0,totalBlue=0,totalHihi=0,streak=0,lastHihi=null;
  let historyList=[];
  let keys = Object.keys(data).sort().slice(-50);

  keys.forEach(d=>{
    let v=data[d];
    let kill=Number(v.kill||0), blue=Number(v.blue||0), hihi=Number(v.hihi||0);
    totalKill+=kill; totalBlue+=blue; totalHihi+=hihi;
    if(hihi>0){ lastHihi=d; streak=0; } else { streak+=kill; }
    historyList.push(`<li>${d}: 討伐${kill}, 青箱${blue}, ヒヒ${hihi}</li>`);
  });

  document.getElementById("history").innerHTML = historyList.join("");

  let blueRate = totalBlue/totalKill*100 || 0;
  let hihiRate = totalHihi/totalBlue*100 || 0;
  let expected = totalBlue*DROP_RATE;
  let diff = totalHihi - expected;
  let judge = diff>0 ? "神" : "地獄";
  if(diff>0) flashGold();

  document.getElementById("stats").innerHTML=`
    <b>日別統計 (${date})</b><br>
    討伐: ${today.kill} / 青箱: ${today.blue} / ヒヒ: ${today.hihi}<br><br>
    <b>全体統計</b><br>
    青箱率: ${blueRate.toFixed(2)}%<br>
    ヒヒ率: ${hihiRate.toFixed(2)}%<br>
    前回ヒヒから: ${streak}戦<br>
    判定: ${judge} (${diff.toFixed(2)})
  `;
}

let chart;
function renderChart(){
  const ctx=document.getElementById("chart");
  const month=document.getElementById("month").value || new Date().toISOString().slice(0,7);
  let labels=[],hihiRates=[],blueRates=[],pointStyles=[];
  Object.keys(data).sort().forEach(d=>{
    if(d.startsWith(month)){
      let v=data[d];
      let kill=Number(v.kill||0), blue=Number(v.blue||0), hihi=Number(v.hihi||0);
      labels.push(d);
      hihiRates.push(blue ? hihi/blue*100 : 0);
      blueRates.push(kill ? blue/kill*100 : 0);
      pointStyles.push(hihi>0 ? "star" : "circle");
    }
  });
  if(chart) chart.destroy();
  chart=new Chart(ctx,{
    type:"line",
    data:{
      labels:labels,
      datasets:[
        {label:"ヒヒ率%", data:hihiRates, pointStyle:pointStyles, pointRadius:6, yAxisID:'y'},
        {label:"青箱率%", data:blueRates, yAxisID:'y1'}
      ]
    },
    options:{
      animation:{duration:300},
      scales:{
        y:{position:"left"},
        y1:{position:"right", grid:{drawOnChartArea:false}}
      }
    }
  });
}

function downloadCSV(){
  let csv="date,kill,blue,hihi\n";
  Object.keys(data).forEach(d=>{
    let v=data[d];
    csv+=`${d},${v.kill},${v.blue},${v.hihi}\n`;
  });
  const blob=new Blob([csv]);
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="data.csv";
  a.click();
}

function toggleTheme(){ document.body.classList.toggle("light"); }

document.getElementById("inputDate").value = new Date().toISOString().slice(0,10);
update(); renderChart();
</script>
</body>
</html>
